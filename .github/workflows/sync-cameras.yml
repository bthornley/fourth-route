name: Sync ALPR cameras

on:
  schedule:
    - cron: '0 9 * * 0'   # Sundays 9am UTC (1am PT)
  workflow_dispatch:        # Allow manual trigger from GitHub UI
    inputs:
      region:
        description: 'Region to sync (or "all")'
        required: true
        default: 'all'

jobs:
  sync:
    name: Overpass → Supabase (All 50 States)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install psycopg2-binary requests

      - name: Sync cameras across all 50 US states + D.C.
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: python etl/fetch_cameras.py --region ${{ github.event.inputs.region || 'all' }}

      - name: Sync USASpending.gov ALPR contracts & federal grants
        if: success()
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: python etl/sync_usaspending.py

      - name: Refresh accountability views & check portal snapshot freshness
        if: success()
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          python3 - <<'EOF'
          import os, psycopg2
          from pathlib import Path
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          conn.autocommit = True
          cur = conn.cursor()
          for sql_path in ("db/jurisdictions.sql", "db/agency_portals.sql"):
              cur.execute(Path(sql_path).read_text(encoding="utf-8"))
          cur.execute("SELECT COUNT(*), COUNT(*) FILTER (WHERE has_verified_portal) FROM camera_agency")
          cam_total, portal_matched = cur.fetchone()
          cur.execute("SELECT COUNT(*), MAX(last_updated), MIN(last_updated) FROM agency_portals")
          portals, newest, oldest = cur.fetchone()
          conn.close()
          print(f"Accountability views refreshed: {cam_total:,} cameras ({portal_matched:,} matched to verified portals)")
          print(f"Agency portals catalog: {portals:,} portals (updated range: {oldest} .. {newest})")
          EOF

      - name: Report camera count
        if: always()
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          python3 - <<'EOF'
          import os, psycopg2
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          cur = conn.cursor()
          cur.execute("SELECT COUNT(*) FROM cameras")
          total = cur.fetchone()[0]
          cur.execute("SELECT COUNT(*) FROM cameras WHERE updated_at > now() - interval '1 day'")
          updated = cur.fetchone()[0]
          cur.execute("SELECT source, COUNT(*) FROM cameras GROUP BY source ORDER BY COUNT(*) DESC")
          by_source = cur.fetchall()
          conn.close()
          print(f"Total cameras in DB: {total:,}")
          print(f"Updated in last 24h: {updated:,}")
          print("By source:")
          for src, cnt in by_source:
              print(f"  {src}: {cnt:,}")
          EOF
