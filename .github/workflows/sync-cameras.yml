name: Sync ALPR cameras

on:
  schedule:
    - cron: '0 9 * * 0'   # Sundays 9am UTC (1am PT)
  workflow_dispatch:        # Allow manual trigger from GitHub UI

jobs:
  sync:
    name: Overpass → Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install psycopg2-binary requests

      - name: Sync all California regions
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: python etl/fetch_cameras.py --region all

      - name: Report camera count
        if: always()
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          python3 - <<'EOF'
          import os, psycopg2
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          cur = conn.cursor()
          cur.execute("SELECT COUNT(*) FROM cameras")
          total = cur.fetchone()[0]
          cur.execute("SELECT COUNT(*) FROM cameras WHERE updated_at > now() - interval '1 day'")
          updated = cur.fetchone()[0]
          cur.execute("SELECT source, COUNT(*) FROM cameras GROUP BY source ORDER BY COUNT(*) DESC")
          by_source = cur.fetchall()
          conn.close()
          print(f"Total cameras in DB: {total:,}")
          print(f"Updated in last 24h: {updated:,}")
          print("By source:")
          for src, cnt in by_source:
              print(f"  {src}: {cnt:,}")
          EOF
