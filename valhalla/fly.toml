app = "fourth-route-valhalla"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"

[[mounts]]
  source = "valhalla_data"
  destination = "/custom_files"

# nginx on 8080 proxies to Valhalla on 8002
[http_service]
  internal_port = 8080
  force_https = false
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "40m"
    interval = "30s"
    timeout = "10s"
    method = "GET"
    path = "/status"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 4096
