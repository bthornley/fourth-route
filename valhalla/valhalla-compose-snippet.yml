  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    platform: linux/arm64
    container_name: alpr_valhalla
    ports:
      - "8002:8002"
    volumes:
      - ./valhalla/custom_files:/custom_files
      - ./valhalla/tiles:/tiles
    environment:
      - use_tiles_ignore_pbf=False
      - force_rebuild=False
      - build_admins=False
      - build_time_zones=False
      - server_threads=2
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s
