services:
  db:
    image: postgis/postgis:16-3.4
    container_name: alpr_db
    environment:
      POSTGRES_DB: alpr_nav
      POSTGRES_USER: alpr
      POSTGRES_PASSWORD: alprpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpr -d alpr_nav"]
      interval: 5s
      timeout: 5s
      retries: 10

  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    platform: linux/arm64
    container_name: alpr_valhalla
    ports:
      - "8002:8002"
    volumes:
      - ./valhalla/custom_files:/custom_files
      - ./valhalla/tiles:/tiles
    environment:
      - use_tiles_ignore_pbf=False
      - force_rebuild=False
      - build_admins=False
      - build_time_zones=False
      - server_threads=2
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  api:
    build: ./api
    container_name: alpr_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://alpr:alprpass@db:5432/alpr_nav
      VALHALLA_URL: http://valhalla:8002
    depends_on:
      db:
        condition: service_healthy
      valhalla:
        condition: service_healthy
    volumes:
      - ./api:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
